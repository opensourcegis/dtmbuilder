name: Test and build Terrain Studio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Check module integrity
        run: go mod download && go mod verify
        shell: bash
      - name: Test
        run: go test -v ./...
      - name: Race checks and vet
        if: runner.os == 'Linux'
        run: |
          go test -race ./...
          go vet ./...
      - name: Build Windows desktop package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Build-Terrain-Studio.ps1
      - name: Build Linux browser and CLI binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/terrain-studio .
          cp README.md NOTICE dist/
          cd dist
          sha256sum terrain-studio > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-studio-${{ runner.os }}
          path: dist/
